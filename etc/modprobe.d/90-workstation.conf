# USB audio: do not let the kernel resample or mix for us, and give the driver
# generous isochronous bandwidth. Installed to /etc/modprobe.d/.
options snd-usb-audio nrpacks=1

# HDA (onboard) codecs: disable runtime power saving, which clicks and adds latency.
options snd-hda-intel power_save=0 power_save_controller=N
options snd_hda_intel power_save=0
