# Environment for workstation-core.service. Installed to /etc/workstation/core.conf.
# Find the names with: wsc-devices
WSC_DEVICE=hw:1,0
WSC_MIDI=hw:2,0,0
WSC_RATE=48000
WSC_PERIOD=64
WSC_PERIODS=2
WSC_CHANNELS=2
# The CPU the audio thread is pinned to: one of the isolated cores from GRUB.
WSC_CPU=3
WSC_PRIORITY=70
