# Kernel command line for the workstation. Installed to /etc/default/grub.d/.
# Edit WSOS_DSP_CPUS to match the machine: these cores are reserved for the audio
# IRQ thread and the audio core. On a 4-core laptop use "2,3"; on 8 cores "4-7".
# Leave at least two cores for everything else (UI, disk, USB, MIDI).
WSOS_DSP_CPUS="2,3"

GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT \
threadirqs \
isolcpus=domain,managed_irq,${WSOS_DSP_CPUS} \
nohz_full=${WSOS_DSP_CPUS} \
rcu_nocbs=${WSOS_DSP_CPUS} \
irqaffinity=0-1 \
processor.max_cstate=1 \
intel_idle.max_cstate=0 \
nosoftlockup \
nowatchdog \
mitigations=off \
quiet"

# mitigations=off: CPU vulnerability mitigations add jitter to syscalls and context
# switches. This machine is a musical instrument, not a multi-tenant server; remove
# the flag if the same install is also your daily browsing machine.

# Show the menu briefly so PC mode can be picked.
GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu
