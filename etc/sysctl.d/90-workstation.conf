# Real-time audio sysctls. Installed to /etc/sysctl.d/.

# Let SCHED_FIFO threads use 100% of a CPU. The default throttles RT tasks to 95%,
# which shows up as a 50 ms gap every second on an isolated core.
kernel.sched_rt_runtime_us = -1

# Keep sample RAM in RAM.
vm.swappiness = 1

# Do not stall the audio thread on dirty page writeback bursts (recording to disk).
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Inotify headroom for the library index watching large sample folders.
fs.inotify.max_user_watches = 524288
